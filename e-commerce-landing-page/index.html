<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel&family=Lato&display=swap"
      rel="stylesheet"
    />
    <title>Website</title>
  </head>
  <body>
    <header class="header-section">
      <h1 class="header-heading"><span>premium</span> quality</h1>

      <!-- navbar -->
      <nav class="navbar">
        <ul class="link-container">
          <li class="link-item"><a href="#" class="link active">home</a></li>
          <li class="link-item"><a href="#" class="link">product</a></li>
          <li class="link-item"><a href="#" class="link">about</a></li>
          <li class="link-item"><a href="#" class="link">contact</a></li>
        </ul>

        <div>
          <div class="cart">
            <span class="cart-item-count">0</span>
            <img src="./img/svg/cart.svg" alt="" class="cart-icon" />
          </div>
        </div>
      </nav>
    </header>

    <!-- best selling products -->
    <section class="best-selling-product-section">
      <h1 class="section-title">best selling products</h1>
      <div class="product-container">
        <div class="product-card">
          <img
            src="https://images.unsplash.com/photo-1669311266009-7210b4de556c?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Y2VpbGluZyUyMGxhbXB8ZW58MHx8MHx8fDA%3D"
            alt=""
            class="product-img"
          />
          <p class="product-name">lights →</p>
        </div>

        <div class="product-card">
          <img
            src="https://images.unsplash.com/photo-1719899779266-ae9427607bf1?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fHN0b2FsfGVufDB8fDB8fHww"
            alt=""
            class="product-img"
          />
          <p class="product-name">stool →</p>
        </div>

        <div class="product-card">
          <img
            src="https://images.unsplash.com/photo-1591129841117-3adfd313e34f?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGRyYXdlcnxlbnwwfHwwfHx8MA%3D%3D"
            alt=""
            class="product-img"
          />
          <p class="product-name">drawer →</p>
        </div>

        <div class="product-card">
          <img
            src="https://images.unsplash.com/photo-1563637329737-328724d1394d?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8c29mYSUyMGFuZCUyMHRhYmxlfGVufDB8fDB8fHww"
            alt=""
            class="product-img"
          />
          <p class="product-name">couch →</p>
        </div>
      </div>
    </section>

    <!-- mid section -->
    <section class="mid-section">
      <div class="section-item-container">
        <img
          src="https://images.unsplash.com/photo-1687262304525-02287047d4d6?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGxpdmluZyUyMHJvb20lMjBjaGFpcnxlbnwwfHwwfHx8MA%3D%3D"
          alt=""
          class="section-bg"
        />
        <div class="section-info">
          <h1 class="title">premium quality in <span>affordale</span> price</h1>
          <p class="info">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti
            rem fugiat, odio blanditiis omnis soluta?
          </p>
        </div>
      </div>
    </section>

    <!-- image collage section -->
    <section class="image-mid-section">
      <div class="image-collage">
        <div class="image-collection">
          <img
            src="https://images.unsplash.com/photo-1567225557594-88d73e55f2cb?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8ZGVjb3JhdGlvbnxlbnwwfHwwfHx8MA%3D%3D"
            alt=""
            class="collage-img"
          />
          <img
            src="https://images.unsplash.com/photo-1708758487256-8a3a73565dc2?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8c3RvYWwlMjBhbmQlMjBzb2ZhfGVufDB8fDB8fHwy"
            alt=""
            class="collage-img"
          />
          <img
            src="https://images.unsplash.com/photo-1654511830326-63a577771a7e?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8c3RvYWwlMjBhbmQlMjBzb2ZhfGVufDB8fDB8fHwy"
            alt=""
            class="collage-img"
          />
        </div>
      </div>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
